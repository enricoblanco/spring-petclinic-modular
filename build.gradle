plugins {
  id 'java'
  id 'checkstyle'
  id 'jacoco'
  id 'org.springframework.boot' version '4.1.0'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'org.graalvm.buildtools.native' version '1.1.2'
  id 'org.cyclonedx.bom' version '3.2.4'
  id 'io.spring.javaformat' version '0.0.47'
  id "io.spring.nohttp" version "0.0.11"
  id "org.sonarqube" version "7.5.0.8588"
}

gradle.startParameter.excludedTaskNames += [ "checkFormatAot", "checkFormatAotTest" ]

group = 'org.springframework.samples'
version = '4.0.0-SNAPSHOT'

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(21)
  }
}

repositories {
  mavenCentral()
}

ext.checkstyleVersion = "12.3.1"
ext.springJavaformatCheckstyleVersion = "0.0.47"
ext.webjarsLocatorLiteVersion = "1.1.3"
ext.webjarsFontawesomeVersion = "4.7.0"
ext.webjarsBootstrapVersion = "5.3.8"

dependencies {
  implementation 'org.springframework.boot:spring-boot-starter-cache'
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
  implementation 'org.springframework.boot:spring-boot-starter-webmvc'
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  implementation 'javax.cache:cache-api'
  implementation 'jakarta.xml.bind:jakarta.xml.bind-api'
  runtimeOnly 'org.springframework.boot:spring-boot-starter-actuator'
  runtimeOnly "org.webjars:webjars-locator-lite:${webjarsLocatorLiteVersion}"
  runtimeOnly "org.webjars.npm:bootstrap:${webjarsBootstrapVersion}"
  runtimeOnly "org.webjars.npm:font-awesome:${webjarsFontawesomeVersion}"
  runtimeOnly 'com.github.ben-manes.caffeine:caffeine'
  runtimeOnly 'com.h2database:h2'
  runtimeOnly 'com.mysql:mysql-connector-j'
  runtimeOnly 'org.postgresql:postgresql'
  developmentOnly 'org.springframework.boot:spring-boot-devtools'
  testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
  testImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'
  testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
  testImplementation 'org.springframework.boot:spring-boot-testcontainers'
  testImplementation 'org.springframework.boot:spring-boot-docker-compose'
  testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
  testImplementation 'org.testcontainers:testcontainers-mysql'
  checkstyle "io.spring.javaformat:spring-javaformat-checkstyle:${springJavaformatCheckstyleVersion}"
  checkstyle "com.puppycrawl.tools:checkstyle:${checkstyleVersion}"
  implementation 'org.springframework.modulith:spring-modulith-starter-core:2.1.1'
  implementation 'org.springframework.modulith:spring-modulith-events-api:2.1.1'
  testImplementation 'org.springframework.modulith:spring-modulith-starter-test:2.1.1'
}

tasks.named('test') {
  useJUnitPlatform()
  finalizedBy 'jacocoTestReport'
}

// XML coverage report consumed by SonarQube (sonar.coverage.jacoco.xmlReportPaths)
tasks.named('jacocoTestReport') {
  dependsOn 'test'
  reports {
    xml.required = true
  }
}

tasks.named("cyclonedxDirectBom").configure {
  dependsOn("compileJava")
  skipConfigs = [".*[Tt]est.*"]
}

checkstyle {
  configDirectory = project.file('src/checkstyle')
  configFile = file('src/checkstyle/nohttp-checkstyle.xml')
}

checkstyleNohttp {
  configDirectory = project.file('src/checkstyle')
  configFile = file('src/checkstyle/nohttp-checkstyle.xml')
}

tasks.named("formatMain").configure { dependsOn("checkstyleMain") }
tasks.named("formatMain").configure { dependsOn("checkstyleNohttp") }

tasks.named("formatTest").configure { dependsOn("checkstyleTest") }
tasks.named("formatTest").configure { dependsOn("checkstyleNohttp") }

checkstyleAot.enabled = false
checkstyleAotTest.enabled = false

checkFormatAot.enabled = false
checkFormatAotTest.enabled = false

formatAot.enabled = false
formatAotTest.enabled = false

sonar {
  properties {
    property "sonar.projectKey", "spring-petclinic-modular"
    property "sonar.host.url", "http://localhost:9000"
    // token comes from the SONAR_TOKEN environment variable, never from the build file
    property "sonar.token", System.getenv("SONAR_TOKEN") ?: ""
    property "sonar.coverage.jacoco.xmlReportPaths",
      layout.buildDirectory.file('reports/jacoco/test/jacocoTestReport.xml').get().asFile.path
  }
}

tasks.named('sonar') {
  dependsOn 'jacocoTestReport'
}

// Robert C. Martin package metrics (Ca, Ce, I, A, D) via ArchUnit: JDepend 2.9.1 cannot read Java 21 bytecode
sourceSets {
  metrics
}

dependencies {
  metricsImplementation 'com.tngtech.archunit:archunit:1.4.2'
}

checkstyleMetrics.enabled = false
checkFormatMetrics.enabled = false

tasks.register('jdependReport', JavaExec) {
  group = 'verification'
  description = 'Prints Robert C. Martin package metrics (ArchUnit, Java 21 compatible)'
  dependsOn 'classes'
  classpath = sourceSets.metrics.runtimeClasspath
  mainClass = 'org.springframework.samples.petclinic.metrics.MartinMetricsReport'
  outputs.upToDateWhen { false }
  def branch = providers.exec {
    commandLine 'git', 'rev-parse', '--abbrev-ref', 'HEAD'
    ignoreExitValue = true
  }.standardOutput.asText.map { it.trim() }
  def reportDir = layout.buildDirectory.dir('reports/martin-metrics')
  doFirst {
    args = [metricsClassesDir(), 'org.springframework.samples.petclinic', reportDir.get().asFile.path,
            metricsLabel(branch)]
  }
}

// Encapsulation indicators per module (public types, exposed entities/repositories/beans, cross-module coupling)
tasks.register('encapsulationReport', JavaExec) {
  group = 'verification'
  description = 'Prints encapsulation and cross-module coupling indicators (ArchUnit)'
  dependsOn 'classes'
  classpath = sourceSets.metrics.runtimeClasspath
  mainClass = 'org.springframework.samples.petclinic.metrics.EncapsulationReport'
  outputs.upToDateWhen { false }
  def branch = providers.exec {
    commandLine 'git', 'rev-parse', '--abbrev-ref', 'HEAD'
    ignoreExitValue = true
  }.standardOutput.asText.map { it.trim() }
  def reportDir = layout.buildDirectory.dir('reports/encapsulation')
  doFirst {
    args = [metricsClassesDir(), 'org.springframework.samples.petclinic', reportDir.get().asFile.path,
            metricsLabel(branch)]
  }
}

// The original JDepend 2.9.1, kept only as evidence (paper, Section 4.4.1): it skips every class whose constant
// pool has a CONSTANT_InvokeDynamic entry (tag 18), printing "Unknown constant: 18" without naming the class
configurations {
  jdependOriginal
}

dependencies {
  jdependOriginal 'jdepend:jdepend:2.9.1'
}

tasks.register('jdependOriginalReport', JavaExec) {
  group = 'verification'
  description = 'Runs the original JDepend 2.9.1 to show which classes it skips on Java 21 bytecode'
  dependsOn 'classes'
  classpath = configurations.jdependOriginal
  mainClass = 'jdepend.textui.JDepend'
  outputs.upToDateWhen { false }
  def reportDir = layout.buildDirectory.dir('reports/jdepend-original')
  doFirst {
    def dir = reportDir.get().asFile
    dir.mkdirs()
    def label = project.findProperty('label') ?: 'local'
    args = ['-file', new File(dir, "jdepend-${label}.txt").path, metricsClassesDir()]
    errorOutput = new FileOutputStream(new File(dir, "jdepend-${label}.err"))
  }
}

// -PclassesDir and -Plabel measure another version (e.g. a worktree of main) without copying the metrics code
def metricsClassesDir() {
  project.findProperty('classesDir') ?: layout.buildDirectory.dir('classes/java/main').get().asFile.path
}

def metricsLabel(branch) {
  project.findProperty('label') ?: branch.getOrElse('local')
}
